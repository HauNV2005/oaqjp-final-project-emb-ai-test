
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Emotion Detector</title>

    <script src="{{ url_for('static', filename='mywebscript.js') }}">
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #263238;
        }

        textarea {
            width: 100%;
            height: 130px;
            padding: 12px;
            box-sizing: border-box;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background-color: #1976d2;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #125ca1;
        }

        #system_response {
            margin-top: 20px;
            padding: 15px;
            background-color: #eef4ff;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Emotion Detector</h1>

        <p>
            Enter a sentence to detect its emotions.
        </p>

        <textarea
            id="textToAnalyze"
            placeholder="Enter your text here..."
        ></textarea>

        <button onclick="RunSentimentAnalysis()">
            Analyze Emotion
        </button>

        <h2>Analysis Result</h2>

        <div id="system_response">
            Results will appear here.
        </div>

    </div>

</body>
</html>
